# Starship config — see https://starship.rs/config/

add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_status\
${custom.python}\
$cmd_duration\
$line_break\
$character"""

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold red"
trim_at = "."
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "yellow"

# disabled modules — keep the prompt clean
[aws]
disabled = true

[gcloud]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

# Custom python module: reads .python-version directly (no pyenv needed)
# and appends active venv name when $VIRTUAL_ENV is set.
[custom.python]
description = "Python version from .python-version + active venv"
when = '[ -f .python-version ] || [ -n "$VIRTUAL_ENV" ]'
command = '''
ver=$(cat .python-version 2>/dev/null)
venv=""
[ -n "$VIRTUAL_ENV" ] && venv=" ($(basename "$VIRTUAL_ENV"))"
printf '%s%s' "$ver" "$venv"
'''
shell = ["bash", "--noprofile", "--norc"]
symbol = " "
style = "yellow bold"
format = "[${symbol}${output}]($style) "
